[project]
name = "monitoring-service"
version = "0.1.0"
description = "monitoring-service (Python/FastAPI) - hexagonal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9", "httpx>=0.27", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pika>=1.3", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0", "opentelemetry-instrumentation-sqlalchemy>=0.48b0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
