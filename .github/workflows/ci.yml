name: monitoring-service-ci

on:
  pull_request:
    branches: [dev, develop, qa, staging, main]
  push:
    branches: ["hu-*-dev", dev, develop, qa, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: monitoring_test
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Monitoring Service
        uses: actions/checkout@v4

      - name: Checkout Monitoring Docs
        uses: actions/checkout@v4
        with:
          repository: Nicolasruiz918/r6-nicolas-design-software-docs
          ref: feat/r6-docs-sync
          path: monitoring-docs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check apps src tests

      - name: Compile
        run: python -m compileall apps src tests

      - name: Verify Monitoring OpenAPI contract
        run: test -f monitoring-docs/07-api/contracts/openapi/monitoring.yaml

      - name: Unit and contract tests
        env:
          AMQP_URL: amqp://guest:guest@localhost:5672/
          MONITORING_DOCS_REPO: ${{ github.workspace }}/monitoring-docs
        run: python -m pytest -q
